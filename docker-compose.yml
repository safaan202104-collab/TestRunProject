version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: myglowtheory_postgres
    environment:
      - POSTGRES_USER=glowtheory
      - POSTGRES_PASSWORD=glowtheorypass
      - POSTGRES_DB=glowtheory
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: myglowtheory_redis
    ports:
      - "6379:6379"

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      - DATABASE_URL=postgresql://glowtheory:glowtheorypass@postgres:5432/glowtheory
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - postgres
      - redis

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  pgdata:
